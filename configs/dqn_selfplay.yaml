game_name: "leduc_poker"
seed: 42
mode: "self_play" # 自博弈模式
algo: "dqn"

training:
  num_episodes: 50000 # 自博弈通常需要更长训练时间
  eval_every: 10000
  save_path: "models/dqn/placeholder.pth"

agent:
  lr: 0.0001
  gamma: 0.99
  hidden_sizes: [128, 128]
  epsilon_start: 1.0
  epsilon_end: 0.01
  epsilon_decay: 0.99998 # 衰减更慢，增加探索
  replay_buffer_size: 300000
  buffer_capacity: 100000
  batch_size: 128
  target_update_freq: 2000
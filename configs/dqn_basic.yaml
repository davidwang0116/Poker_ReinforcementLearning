# configs/dqn_basic.yaml

game_name: "leduc_poker"
seed: 42
mode: "basic"  # 基础模式

training:
  num_episodes: 100000
  eval_every: 2000
  save_path: "models/dqn/dqn_basic_final.pth"

agent:
  lr: 0.0001
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_decay: 0.99995
  buffer_capacity: 50000
  batch_size: 128
  target_update_freq: 1000

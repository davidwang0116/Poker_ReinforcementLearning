# configs/dqn_basic.yaml

game_name: "leduc_poker"
seed: 42
mode: "basic"  # 基础模式
algo: "dqn"

training:
  num_episodes: 100000
  eval_every: 2000
  save_path: "models/dqn/dqn_basic_seed_42_lr_0.0003_10k.pth"

agent:
  lr: 0.0003
  gamma: 0.99
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_decay: 0.99995
  buffer_capacity: 50000
  batch_size: 128
  target_update_freq: 1000
  hidden_sizes: [128, 128]
  replay_buffer_size: 100000